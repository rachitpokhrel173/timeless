<title>Timeless Ties Video Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>
<style>
/* Layout: a video player (16:9 stage + caption + controls) beside a chapter rail; recording notes below. */
:root {
  --bg: #f6f2ee;
  --surface: #fffdfb;
  --ink: #2a1d21;
  --muted: #6e5f63;
  --line: #e4d9d0;
  --wine: #641a35;
  --gold: #9c7740;
  --on-wine: #ffffff;
  --frame: #1d1517;
  --display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161113; --surface: #211a1c; --ink: #f2e9e5; --muted: #b6a7a3; --line: #3b2f31;
    --wine: #d47d9f; --gold: #cfa86c; --on-wine: #1b1214; --frame: #0d0a0b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161113; --surface: #211a1c; --ink: #f2e9e5; --muted: #b6a7a3; --line: #3b2f31;
  --wine: #d47d9f; --gold: #cfa86c; --on-wine: #1b1214; --frame: #0d0a0b; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
header .kick { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
header h1 { font-family: var(--display); font-weight: 600; font-size: clamp(34px, 5vw, 50px); line-height: 1.05; margin: 4px 0 8px; text-wrap: balance; }
header p { margin: 0; color: var(--muted); max-width: 68ch; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 22px; align-items: start; }
@media (max-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* Player */
.player { background: var(--frame); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.screen { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; overflow: hidden; background: #f4f1ec; }
.stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; }
.bigplay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(20, 12, 15, .28); border: 0; cursor: pointer; z-index: 80; }
.bigplay span { width: 84px; height: 84px; border-radius: 50%; background: #641a35; display: grid; place-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.bigplay:focus-visible span { outline: 3px solid #e7c98f; outline-offset: 4px; }
.bar { height: 6px; background: rgba(255,255,255,.14); cursor: pointer; position: relative; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: #c9a15f; width: 0; }
.caption { color: #f3ece6; padding: 14px 18px 4px; min-height: 92px; }
.caption .where { font-family: var(--mono); font-size: 11.5px; color: #c9a15f; letter-spacing: .04em; }
.caption p { margin: 4px 0 0; font-size: 16px; line-height: 1.5; max-width: 80ch; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px 14px; }
.controls button, .controls select {
  height: 36px; border-radius: 8px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06);
  color: #f3ece6; font: 600 13px var(--body); padding: 0 12px; cursor: pointer;
}
.controls button.main { background: #f3ece6; color: #2a1d21; border-color: #f3ece6; min-width: 92px; }
.controls button:focus-visible, .controls select:focus-visible { outline: 2px solid #e7c98f; outline-offset: 2px; }
.controls .time { font-family: var(--mono); font-size: 12px; color: #bdb0aa; margin-left: auto; }
.controls select option { color: #2a1d21; }
.player:fullscreen { justify-content: center; border-radius: 0; }
.player:fullscreen .screen { width: min(100vw, calc((100vh - 170px) * 16 / 9)); margin: 0 auto; }

/* Chapter rail */
.rail { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.rail h2 { font-family: var(--display); font-weight: 600; font-size: 24px; margin: 2px 6px 8px; }
.chap { display: grid; grid-template-columns: 28px 1fr; gap: 10px; text-align: left; background: none; border: 0; border-radius: 10px; padding: 9px 8px; color: var(--ink); font: 500 14px var(--body); cursor: pointer; }
.chap b { font-family: var(--mono); font-weight: 500; font-size: 12px; color: var(--muted); padding-top: 2px; }
.chap small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
.chap:hover { background: color-mix(in srgb, var(--gold) 10%, transparent); }
.chap.on { background: color-mix(in srgb, var(--wine) 12%, transparent); }
.chap.on b { color: var(--wine); }
.chap:focus-visible { outline: 2px solid var(--wine); outline-offset: 1px; }

.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.note { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; min-width: 0; }
.note h3 { font-family: var(--display); font-weight: 600; font-size: 22px; margin: 0 0 8px; }
.note ol, .note ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.note kbd { font-family: var(--mono); font-size: 12.5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; background: var(--bg); }
.note a { color: var(--wine); }

/* ───────── Stage: pictures of the real app, fixed light palette ───────── */
.stage { font-family: var(--body); color: #24201d; font-size: 13px; line-height: 1.4; background: #f4f1ec; }
.app { display: grid; grid-template-columns: 212px 1fr; height: 720px; }
.side { background: #231c1b; color: #cfc5ba; padding: 14px 10px; font-size: 12px; overflow: hidden; }
.brand { font-family: var(--display); color: #fff; font-size: 21px; font-weight: 600; padding: 2px 8px 6px; }
.brand small { display: block; font-family: var(--body); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #b89a66; font-weight: 600; }
.grp { margin-top: 7px; border-radius: 8px; }
.grp > b { display: block; font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: #8c8177; padding: 3px 8px; }
.ni { padding: 2px 8px; border-radius: 6px; line-height: 17px; }
.ni.on { background: rgba(184,154,102,.25); color: #fff; font-weight: 600; }
.main { display: flex; flex-direction: column; min-width: 0; }
.top { height: 54px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 24px; background: #fff; border-bottom: 1px solid #e7e0d7; }
.search { width: 420px; height: 34px; border: 1px solid #e2dbd2; border-radius: 9px; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #8a7f76; background: #faf8f5; }
.bell { margin-left: auto; position: relative; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; border: 1px solid #e7e0d7; }
.bell .dot { position: absolute; top: -5px; right: -6px; background: #641a35; color: #fff; font-size: 10.5px; font-weight: 700; border-radius: 99px; padding: 1px 6px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: #a8834a; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.content { padding: 22px 28px; flex: 1; overflow: hidden; position: relative; display: flex; flex-direction: column; gap: 14px; }
.crumb { font-size: 12px; color: #8a7f76; margin-bottom: -10px; }
.hrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hrow .sp { flex: 1; }
.pt { font-size: 23px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.pd { color: #7a6f67; font-size: 13px; margin-top: -10px; }
.card { background: #fff; border: 1px solid #e7e0d7; border-radius: 12px; padding: 16px; }
.card.p0 { padding: 0; overflow: hidden; }
.card h4 { margin: 0 0 10px; font-size: 14px; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 14px; }
.g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.f label { font-size: 12px; font-weight: 600; display: block; margin-bottom: 5px; color: #3b332e; }
.f .hint, .hint { font-size: 11.5px; color: #8a7f76; margin-top: 4px; }
.in { min-height: 34px; border: 1px solid #ddd5cb; border-radius: 8px; padding: 0 10px; display: flex; align-items: center; background: #fff; white-space: nowrap; overflow: hidden; font-size: 13px; }
.in.sel { justify-content: space-between; }
.in.sel::after { content: ""; width: 7px; height: 7px; border-right: 1.5px solid #7a6f67; border-bottom: 1.5px solid #7a6f67; transform: rotate(45deg) translateY(-2px); margin-left: 10px; flex: none; }
.in.ta { align-items: flex-start; padding: 8px 10px; white-space: pre-wrap; line-height: 1.5; min-height: 64px; font-size: 12.5px; }
.in.typing::after { content: ""; width: 1.5px; height: 16px; background: #641a35; margin-left: 1px; animation: blink .8s steps(1) infinite; }
.in.open { border-color: #a8834a; box-shadow: 0 0 0 3px rgba(168,131,74,.2); }
@keyframes blink { 50% { opacity: 0; } }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 9px; border: 1px solid #ddd5cb; font-size: 13px; font-weight: 600; background: #fff; white-space: nowrap; transition: transform .12s; }
.btn.p { background: #641a35; color: #fff; border-color: #641a35; }
.btn.sm { height: 30px; padding: 0 11px; font-size: 12.5px; }
.btn.danger { color: #b42318; border-color: transparent; background: transparent; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.wide { width: 100%; justify-content: center; height: 40px; }
.press { transform: scale(.95); }
.cb { display: flex; gap: 9px; align-items: flex-start; font-size: 13px; }
.cb i { width: 17px; height: 17px; border: 1.5px solid #b9afa4; border-radius: 4px; flex: none; margin-top: 1px; display: grid; place-items: center; font-style: normal; color: #fff; font-size: 12px; font-weight: 700; }
.cb.on i { background: #641a35; border-color: #641a35; }
.cb.on i::after { content: "\2713"; }
.cb small { display: block; color: #8a7f76; font-size: 11.5px; }
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 99px; font-size: 11.5px; font-weight: 700; background: #eee9e2; color: #5d544d; }
.pill.gold { background: #f5ead6; color: #7d5d26; }
.pill.green { background: #def0e3; color: #23663f; }
.pill.blue { background: #e1ebf7; color: #2b5a8f; }
.pill.red { background: #f9e1de; color: #a1251a; }
.pill.amber { background: #fbecd2; color: #8a5a0f; }
.tb { width: 100%; border-collapse: collapse; font-size: 13px; }
.tb th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #8a7f76; font-weight: 600; padding: 10px 14px; border-bottom: 1px solid #ece6de; background: #fbf9f6; }
.tb td { padding: 10px 14px; border-bottom: 1px solid #f0ebe4; vertical-align: top; }
.tb tr:last-child td { border-bottom: 0; }
.tb td.r, .tb th.r { text-align: right; font-variant-numeric: tabular-nums; }
.tb .sm { font-size: 11.5px; color: #8a7f76; }
.tb .gold { color: #a8834a; }
.tb tr.new td { background: #fdf8ee; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid #e7e0d7; }
.tabs span { padding: 8px 14px; font-weight: 600; color: #7a6f67; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs span.on { color: #24201d; border-color: #641a35; }
.kpi { background: #fff; border: 1px solid #e7e0d7; border-radius: 12px; padding: 14px 16px; }
.kpi small { display: block; color: #7a6f67; font-size: 12px; }
.kpi b { display: block; font-size: 22px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi em { font-style: normal; font-size: 11.5px; color: #8a7f76; }
.dl { display: grid; grid-template-columns: 120px 1fr; gap: 7px 12px; font-size: 13px; }
.dl dt { color: #8a7f76; }
.dl dd { margin: 0; font-weight: 500; }
.row { display: flex; align-items: center; gap: 10px; }
.row .sp { flex: 1; }
.ring { outline: 3px solid rgba(201,161,95,.95) !important; outline-offset: 3px; border-radius: 8px; box-shadow: 0 0 0 9px rgba(201,161,95,.18); transition: outline-offset .2s; }
.pop { animation: pop .35s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.ov { position: absolute; inset: 0; background: rgba(24,16,14,.38); display: flex; align-items: center; justify-content: center; z-index: 20; }
.dlg { width: 560px; background: #fff; border-radius: 14px; padding: 20px 22px; box-shadow: 0 24px 60px rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 13px; }
.dlg h3 { margin: 0; font-size: 17px; }
.dlg p { margin: 0; color: #7a6f67; font-size: 13px; }
.dlg .foot { display: flex; justify-content: flex-end; gap: 8px; padding-top: 4px; }
.menu { position: absolute; z-index: 25; background: #fff; border: 1px solid #e2dbd2; border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.16); width: 280px; padding: 6px; }
.menu .mh { font-size: 11.5px; color: #8a7f76; padding: 6px 10px 8px; }
.menu .mi { padding: 9px 10px; border-radius: 8px; font-weight: 500; }
.menu .mi.danger { color: #b42318; }
.toast { position: absolute; right: 26px; bottom: 26px; z-index: 40; background: #1f2b23; color: #fff; padding: 12px 16px; border-radius: 11px; font-size: 13.5px; font-weight: 500; display: flex; gap: 9px; align-items: center; box-shadow: 0 12px 30px rgba(0,0,0,.25); animation: pop .3s ease-out; max-width: 560px; }
.toast i { width: 18px; height: 18px; border-radius: 50%; background: #3f9b63; display: grid; place-items: center; font-style: normal; font-size: 11px; flex: none; }
.toast i::after { content: "\2713"; }
.cur { position: absolute; left: 0; top: 0; z-index: 60; width: 26px; height: 26px; pointer-events: none; transition: transform .7s cubic-bezier(.45,.05,.2,1); filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
.rip { position: absolute; z-index: 59; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 3px solid rgba(201,161,95,.95); pointer-events: none; animation: rip .55s ease-out forwards; }
@keyframes rip { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }

/* Slides */
.slide { position: absolute; inset: 0; background: #3d0f20; color: #f6eee6; display: flex; align-items: center; padding: 0 110px; }
.slide::before { content: ""; position: absolute; inset: 34px; border: 1px solid rgba(214,182,124,.35); border-radius: 6px; pointer-events: none; }
.slide .kick { font-size: 15px; letter-spacing: .2em; text-transform: uppercase; color: #d6b67c; font-weight: 600; }
.slide h1 { font-family: var(--display); font-weight: 600; font-size: 96px; line-height: 1; margin: 14px 0 18px; }
.slide h1 em { color: #d6b67c; font-weight: 500; }
.slide p { font-size: 24px; color: #e3d4c8; margin: 0; max-width: 900px; }
.slide .steps { display: flex; gap: 12px; margin-top: 34px; flex-wrap: wrap; }
.slide .steps span { border: 1px solid rgba(214,182,124,.5); border-radius: 99px; padding: 8px 18px; font-size: 17px; }
.slide table { border-collapse: collapse; width: 100%; font-size: 17px; margin-top: 18px; }
.slide td { padding: 9px 12px; border-bottom: 1px solid rgba(214,182,124,.22); }
.slide td:first-child { font-family: var(--display); font-size: 21px; color: #fff; width: 360px; }
.slide td:last-child { color: #e3d4c8; }
.slide .tag { font-size: 12px; color: #d6b67c; letter-spacing: .1em; text-transform: uppercase; }

/* Login */
.auth { position: absolute; inset: 0; background: #f1ece5; display: flex; align-items: center; justify-content: center; }
.acard { width: 420px; background: #fff; border: 1px solid #e7e0d7; border-radius: 16px; padding: 30px 32px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 50px rgba(60,30,30,.08); }
.alogo { font-family: var(--display); font-size: 32px; font-weight: 600; color: #641a35; text-align: center; }
.asub { text-align: center; color: #7a6f67; margin-top: -10px; }
.alink { text-align: center; color: #641a35; font-weight: 600; font-size: 13px; }
.url { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); background: #fff; border: 1px solid #e2dbd2; border-radius: 99px; padding: 6px 18px; font-family: var(--mono); font-size: 12.5px; color: #5d544d; }

/* Public site */
.site { position: absolute; inset: 0; background: #fbf7f2; overflow: hidden; }
.snav { display: flex; align-items: center; gap: 26px; padding: 18px 48px; border-bottom: 1px solid #ece4d8; font-size: 14px; color: #5d544d; background: #fff; }
.snav .slogo { font-family: var(--display); font-size: 26px; font-weight: 600; color: #641a35; margin-right: auto; }
.snav .on { color: #641a35; font-weight: 700; }
.shero { padding: 26px 48px 10px; }
.shero h1 { font-family: var(--display); font-size: 46px; font-weight: 600; margin: 0; color: #2a1d21; }
.shero h1 em { color: #a8834a; }
.shero p { margin: 4px 0 0; color: #6b625a; font-size: 15px; }
.sform { margin: 12px 48px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 16px; padding: 22px; }
.sform .full { grid-column: 1 / -1; }
.thanks { grid-column: 1 / -1; background: #e4f2e8; color: #1f5c37; border-radius: 10px; padding: 12px 14px; font-weight: 600; }

/* Email */
.inbox { position: absolute; inset: 0; background: #eef1f5; display: grid; grid-template-columns: 250px 1fr; }
.ilist { background: #fff; border-right: 1px solid #dfe4ea; padding: 16px 0; }
.ilist b { display: block; padding: 0 18px 12px; font-size: 16px; }
.ilist .it { padding: 10px 18px; border-left: 3px solid transparent; font-size: 12.5px; color: #4a5260; }
.ilist .it.on { background: #e8eef7; border-color: #2b5a8f; color: #1d2430; font-weight: 600; }
.imsg { overflow: hidden; display: flex; flex-direction: column; }
.ihead { padding: 16px 26px 10px; background: #fff; border-bottom: 1px solid #dfe4ea; }
.isub { font-size: 18px; font-weight: 600; color: #1d2430; }
.ifrom { font-size: 12px; color: #6a7383; margin-top: 2px; }
.em { background: #f7f3ec; flex: 1; padding: 18px 0; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
.emc { width: 540px; background: #fff; border: 1px solid #ece4d8; border-radius: 12px; overflow: hidden; }
.emtop { height: 4px; background: #641a35; }
.embrand { text-align: center; padding: 16px 24px 12px; border-bottom: 1px solid #ece4d8; font-family: Georgia, serif; color: #641a35; font-size: 19px; }
.embody { padding: 16px 26px 18px; font-size: 13.5px; line-height: 1.6; color: #24201d; }
.embody h3 { font-family: Georgia, serif; font-weight: normal; font-size: 22px; margin: 0 0 10px; }
.embody p { margin: 0 0 9px; }
.emdet { width: 100%; border-collapse: collapse; background: #fbf8f3; border: 1px solid #ece4d8; border-radius: 8px; margin: 6px 0 12px; }
.emdet td { padding: 7px 14px; border-top: 1px solid #ece4d8; font-size: 12.5px; color: #6b625a; }
.emdet tr:first-child td { border-top: 0; }
.emdet td + td { text-align: right; color: #24201d; font-weight: 600; }
.emdet td.big { font-family: Georgia, serif; font-size: 17px; color: #641a35; }
.emcta { display: inline-block; background: #641a35; color: #fff; border-radius: 99px; padding: 10px 24px; font-weight: 700; font-size: 13.5px; }
.emsign { margin-top: 12px !important; }
.emsign i { font-family: Georgia, serif; color: #641a35; font-style: normal; font-size: 15px; }
.emfoot { font-size: 11px; color: #9a9087; margin-top: 10px; }

/* Phone */
.desk { position: absolute; inset: 0; background: linear-gradient(160deg, #efe7dd, #e4d8ca); display: flex; align-items: center; justify-content: center; gap: 70px; }
.phone { width: 330px; height: 676px; background: #1b1617; border-radius: 44px; padding: 12px; box-shadow: 0 30px 70px rgba(50,25,20,.3); }

<div class="wrap">
  <header>
    <div class="kick">Timeless Ties Events &amp; Decor · staff training</div>
    <h1>Video manual</h1>
    <p>Press play to watch the whole flow: a website inquiry, the quotation, the booking and advance, payments and email, and editing the website. A voice reads each step and the captions show the same words.</p>
  </header>

  <div class="layout">
    <section class="player" id="player" aria-label="Video manual player">
      <div class="screen" id="screen">
        <div class="stage" id="stage"></div>
        <button class="bigplay" id="bigplay" aria-label="Play the video manual"><span><svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="#fff"/></svg></span></button>
      </div>
      <div class="bar" id="bar" title="Jump to a step"><i id="fill"></i></div>
      <div class="caption" aria-live="polite">
        <div class="where" id="where"></div>
        <p id="cap"></p>
      </div>
      <div class="controls">
        <button id="prev" aria-label="Previous step">Back</button>
        <button id="play" class="main">Play</button>
        <button id="next" aria-label="Next step">Next</button>
        <button id="voiceBtn" aria-pressed="true">Voice on</button>
        <select id="voiceSel" aria-label="Voice"></select>

          <option value="0.9">0.9×</option>

          <option value="1.15">1.15×</option>
          <option value="1.3">1.3×</option>

        <button id="fs">Full screen</button>
        <span class="time" id="time"></span>

    </section>

    <nav class="rail" aria-label="Chapters">

      <div id="chapters" style="display:flex;flex-direction:column;gap:2px"></div>
    </nav>
  </div>

</div>

<script>
(function () {
  "use strict";

  /* ───────── building blocks ───────── */
  const F = (label, val, t, cls = "", hint = "") =>
    `<div class="f"><label>${label}</label><div class="in ${cls}" data-t="${t}">${val}</div>${hint ? `<div class="hint">${hint}</div>` : ""}</div>`;
  const B = (txt, t, k = "") => `<span class="btn ${k}" data-t="${t}">${txt}</span>`;
  const CB = (txt, t, on, sub = "") => `<div class="cb ${on ? "on" : ""}" data-t="${t}"><i></i><span>${txt}${sub ? `<small>${sub}</small>` : ""}</span></div>`;
  const P = (txt, tone = "") => `<span class="pill ${tone}">${txt}</span>`;
  const ICON = {
    search: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    bell: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5d544d" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>',
    up: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5d544d" stroke-width="2"><path d="m18 15-6-6-6 6"/></svg>',
    down: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5d544d" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>',
    pen: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#5d544d" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4Z"/></svg>'
  };
  const NAV = [
    ["Overview", ["Dashboard", "Notifications"]],
    ["Clients & Sales", ["Leads", "Inquiries", "Pipeline", "Customers", "Quotations", "Bookings"]],
    ["Event Management", ["Calendar", "Events", "Tasks"]],
    ["Operations", ["Inventory", "Vendors", "Staff"]],
    ["Finance", ["Invoices", "Payments", "Expenses"]],
    ["Website", ["Website CMS", "Services", "Packages", "Gallery", "Testimonials"]],
    ["System", ["Settings", "Users & Roles", "Activity Logs"]]
  ];
  function shell(active, body, overlay = "", badge = 0) {
    const side = NAV.map(([g, items], i) =>
      `<div class="grp" data-t="g${i}"><b>${g.replace("&", "&amp;")}</b>${items.map(n => `<div class="ni ${n === active ? "on" : ""}">${n.replace("&", "&amp;")}</div>`).join("")}</div>`).join("");
    return `<div class="app"><aside class="side"><div class="brand">Timeless Ties<small>Admin</small></div>${side}</aside>
      <div class="main"><div class="top"><div class="search" data-t="search">${ICON.search} Search customers, quotations, bookings…</div>
      <div class="bell" data-t="bell">${ICON.bell}${badge ? `<span class="dot">${badge}</span>` : ""}</div><div class="avatar">TT</div></div>
      <div class="content">${body}</div></div></div>${overlay}`;
  }
  function mail(subject, heading, paras, rows, cta, list) {
    return `<div class="inbox"><div class="ilist"><b>Inbox</b>${list.map((l, i) => `<div class="it ${i === 0 ? "on" : ""}">${l}</div>`).join("")}</div>
      <div class="imsg"><div class="ihead"><div class="isub">${subject}</div><div class="ifrom">Timeless Ties Events &amp; Decor &lt;noreply@timelesstieevents.com.np&gt; · to priya@example.com</div></div>
      <div class="em"><div class="emc"><div class="emtop"></div><div class="embrand">Timeless Ties Events &amp; Decor</div>
      <div class="embody"><h3>${heading}</h3>${paras.map(p => `<p>${p}</p>`).join("")}
      <table class="emdet" data-t="det">${rows.map(([a, b, big]) => `<tr><td>${a}</td><td class="${big ? "big" : ""}">${b}</td></tr>`).join("")}</table>
      ${cta ? `<span class="emcta" data-t="cta">${cta} &rarr;</span>` : ""}
      <p class="emsign">Warm regards,<br><i>The Timeless Ties team</i></p></div></div>
      <div class="emfoot">This is an automated email. Please do not reply to this message.</div></div></div></div>`;
  }

  /* ───────── screens reused by several steps ───────── */
  function quoteView(o) {
    const sent = o.status !== "Draft";
    const actions = `${sent ? B("Share", "share") : ""}${B("Print / PDF", "print")}${o.status !== "Accepted" ? B("Edit", "edit") : ""}${B("Duplicate", "dup")}
      ${o.status !== "Accepted" ? B(sent ? "Re-send" : "Send to client", "send", sent ? "" : "p") : ""}${B("Record advance", "recadv", o.status === "Accepted" ? "p" : "")}${B("Convert to booking", "convert")}${sent && o.status !== "Accepted" ? B("Mark declined", "decl", "danger") : ""}`;
    const tone = { Draft: "", Sent: "blue", Accepted: "green" }[o.status];
    const body = `<div class="crumb">Quotations /</div>
      <div class="hrow"><h2 class="pt">Priya &amp; Anil — wedding reception</h2><span data-t="st-a">${P(o.status, tone)}</span><span data-t="st-b" hidden>${P("Sent", "blue")}</span></div>
      <div class="pd">QT-2026-021 · Priya Sharma · valid until 20 Nov 2026</div>
      <div class="row" style="flex-wrap:wrap;gap:8px">${actions}</div>
      <div class="g2" style="grid-template-columns:1.55fr 1fr">
        <div class="card p0"><table class="tb"><thead><tr><th>Description</th><th class="r">Qty</th><th class="r">Unit price</th><th class="r">Amount</th></tr></thead><tbody>
          <tr><td><b>Royal Wedding package</b><div class="sm">1 × stage backdrop, 2 × entrance arch, 40 × table centrepiece</div></td><td class="r">1</td><td class="r">3,50,000</td><td class="r">3,50,000</td></tr>
          <tr><td><b>Fairy-light canopy</b><div class="sm gold">Linked to inventory</div></td><td class="r">2</td><td class="r">12,000</td><td class="r">24,000</td></tr>
          <tr><td><b>Mandap with fresh florals</b></td><td class="r">1</td><td class="r">85,000</td><td class="r">85,000</td></tr>
          <tr><td class="sm">Subtotal 4,59,000 · discount 5% −22,950 · VAT 13% +56,687</td><td></td><td class="r"><b>Total</b></td><td class="r"><b>NPR 4,92,737</b></td></tr>
        </tbody></table></div>
        <div style="display:flex;flex-direction:column;gap:14px">
          <div class="card"><h4>Client</h4><dl class="dl"><dt>Name</dt><dd>Priya Sharma</dd><dt>Email</dt><dd>priya@example.com</dd><dt>Event</dt><dd>12 Dec 2026 · Hotel Shanker</dd><dt>Guests</dt><dd>300</dd></dl></div>
          <div class="card"><h4>Advance</h4><dl class="dl"><dt>To confirm</dt><dd>NPR 1,00,000</dd><dt>Balance</dt><dd>NPR 3,92,737</dd></dl></div>
        </div>
      </div>`;
    let overlay = "";
    if (o.send) overlay += `<div class="ov" data-t="dlg-send"><div class="dlg"><h3>Send quotation</h3>
      <p>The client gets a private link to review, download and accept the quotation. Sending freezes this version.</p>
      ${CB("Email the link to priya@example.com", "emcb", true, "They'll get an email with the link. You can also share it on WhatsApp.")}
      <div class="foot">${B("Cancel", "x")}${B("Mark as sent", "marksent", "p")}</div></div></div>`;
    if (o.menu) overlay += `<div class="menu" data-t="menu" hidden style="left:242px;top:206px"><div class="mh">Client can view &amp; download — no login needed</div>
      <div class="mi" data-t="m-wa">Send on WhatsApp</div><div class="mi" data-t="m-copy">Copy client link</div><div class="mi" data-t="m-open">Open client view</div><div class="mi danger" data-t="m-reset">Reset link</div></div>`;
    if (o.adv) overlay += `<div class="ov" data-t="dlg-adv" hidden><div class="dlg"><h3>Record advance payment</h3><p>Advance to confirm: NPR 1,00,000. This turns the quotation into a booking (with its event and inventory reservations) and records the payment against it.</p>
      <div class="g2">${F("Advance received (NPR)", "1,00,000", "amt")}${F("Date received", "25 Oct 2026", "pdate")}${F("Method", "Cash", "meth", "sel")}${F("Reference", "", "ref")}</div>
      ${CB("Confirm the booking now", "conf", true, "Leave unticked to keep it pending until NPR 1,00,000 in total is paid.")}
      <div class="foot">${B("Cancel", "x2")}${B("Record advance &amp; book", "savadv", "p")}</div></div></div>`;
    return shell("Quotations", body, overlay);
  }

  /* ───────── the scenes ───────── */
  const CHAPTERS = ["Welcome and signing in", "A new inquiry", "Making a quotation", "Sending and sharing", "What the client sees", "Booking and the advance", "Payments and email", "Editing the website"];

  const S = [];
  const add = (ch, title, say, html, steps = []) => S.push({ ch, title, say, html, steps });

  /* 1. Welcome */
  add(0, "Welcome",
    "Welcome to the Timeless Ties video manual. In about ten minutes you will see how an inquiry becomes a quotation, a booking and a payment, how the emails work, and how to edit the website.",
    () => `<div class="slide"><div><div class="kick">Timeless Ties Events &amp; Decor</div><h1>The admin panel, <em>step by step</em></h1><p>From the first website inquiry to a paid, confirmed event.</p>
      <div class="steps"><span>Inquiry</span><span>Quotation</span><span>Booking</span><span>Payment</span><span>Email</span><span>Website</span></div></div></div>`);
  add(0, "Signing in",
    "Staff sign in at slash admin slash login, with the email and password from their invitation. If you forget your password, click Forgot password and a reset link is emailed to you.",
    () => `<div class="auth"><div class="url">timelesstieevents.com.np/admin/login</div><div class="acard"><div class="alogo">Timeless Ties</div><div class="asub">Sign in to the admin panel</div>
      ${F("Email", "", "email")}${F("Password", "", "pw")}${B("Sign in", "signin", "p wide")}<div class="alink" data-t="forgot">Forgot password?</div></div></div>`,
    [{ t: "type", to: "email", text: "you@timelesstieevents.com.np" }, { t: "type", to: "pw", text: "••••••••••" }, { t: "click", to: "signin" }, { t: "hl", to: "forgot" }]);
  add(0, "The dashboard",
    "This is the dashboard. The menu on the left is grouped by job: clients and sales, events, operations, finance and the website. You only see the parts your role allows. The search bar at the top finds any customer, quotation or booking.",
    () => shell("Dashboard", `<h2 class="pt">Dashboard</h2><div class="pd">Today at a glance.</div>
      <div class="g4"><div class="kpi"><small>New inquiries</small><b>3</b><em>this week</em></div><div class="kpi"><small>Quotations awaiting reply</small><b>4</b><em>NPR 14,80,000</em></div><div class="kpi"><small>Events this month</small><b>6</b><em>next: 2 Nov</em></div><div class="kpi"><small>Money owed</small><b>NPR 7,37,737</b><em>3 bookings</em></div></div>
      <div class="g2"><div class="card"><h4>Upcoming events</h4><div class="list"><div class="li"><div class="t">Rai engagement<small>2 Nov 2026 · Soaltee</small></div>${P("Confirmed", "green")}</div><div class="li"><div class="t">Thapa bratabandha<small>9 Nov 2026 · Bhaktapur</small></div>${P("Confirmed", "green")}</div><div class="li"><div class="t">Karki 25th anniversary<small>21 Nov 2026 · Dhulikhel</small></div>${P("Pending", "amber")}</div></div></div>
      <div class="card"><h4>Today's follow-ups</h4><div class="list"><div class="li"><div class="t">Call Sunita Rai about the advance<small>Phone · due today</small></div></div><div class="li"><div class="t">Send gallery ideas to Bikash<small>WhatsApp · due today</small></div></div></div></div></div>`),
    [{ t: "hl", to: "g1" }, { t: "hl", to: "g2" }, { t: "hl", to: "g4" }, { t: "hl", to: "g5" }, { t: "hl", to: "search" }]);

  /* 2. Inquiry */
  add(1, "The website inquiry form",
    "It starts on the website. A visitor fills in the inquiry form with their name, contact details, event type, date and guest count, and clicks Send inquiry.",
    () => `<div class="site"><div class="snav"><span class="slogo">Timeless Ties</span><span>Home</span><span>Services</span><span>Gallery</span><span>Catalogue</span><span>About</span><span class="on">Contact</span></div>
      <div class="shero"><h1>Let's plan your <em>celebration</em></h1><p>Tell us about your event and our team will get back to you.</p></div>
      <div class="card sform">${F("Your name", "", "nm")}${F("Phone", "", "ph")}${F("Email", "", "ml")}${F("Event type", "Choose…", "et", "sel")}${F("Event date", "", "ed")}${F("Guests", "Choose…", "gs", "sel")}
      <div class="f full"><label>Tell us about your ideas</label><div class="in ta" data-t="msg"></div></div><div>${B("Send inquiry", "send", "p")}</div>
      <div class="thanks" data-t="thanks" hidden>Thank you! We've received your inquiry. Reference IQ-2026-014.</div></div></div>`,
    [{ t: "type", to: "nm", text: "Priya Sharma" }, { t: "type", to: "ph", text: "+977 980-0000000" }, { t: "type", to: "ml", text: "priya@example.com" }, { t: "sel", to: "et", text: "Wedding" },
     { t: "type", to: "ed", text: "12 Dec 2026" }, { t: "sel", to: "gs", text: "250–300" }, { t: "type", to: "msg", text: "We'd love a pastel theme with lots of fresh flowers." }, { t: "click", to: "send" }, { t: "show", to: "thanks" }]);
  add(1, "The confirmation email",
    "The visitor gets a confirmation email straight away, with their reference number. It comes from the no-reply address. You can switch it off in Settings, Automations.",
    () => mail("We received your inquiry (IQ-2026-014) — Timeless Ties", "Thank you, Priya!",

      [["Reference", "IQ-2026-014"], ["Event", "Wedding"], ["Date", "Saturday, 12 December 2026"]], "", ["We received your inquiry", "Weekly offers", "Your receipt"]),
    [{ t: "hl", to: "det", ms: 2400 }]);
  add(1, "The inquiry in the admin panel",
    "In the admin panel, the bell shows a new notification, and the inquiry appears under Clients and Sales, Inquiries. Click it to open everything the client sent.",
    () => shell("Inquiries", `<h2 class="pt">Inquiries</h2><div class="pd">Website inquiries and booking requests.</div>
      <div class="card p0"><table class="tb"><thead><tr><th>Ref</th><th>Name</th><th>Event</th><th>Date</th><th>Guests</th><th>Status</th></tr></thead><tbody>
      <tr class="new" data-t="row"><td>IQ-2026-014</td><td><b>Priya Sharma</b></td><td>Wedding</td><td>12 Dec 2026</td><td>250–300</td><td>${P("New", "gold")}</td></tr>
      <tr><td>IQ-2026-013</td><td>Sunita Rai</td><td>Engagement</td><td>2 Nov 2026</td><td>100–150</td><td>${P("Quoted", "blue")}</td></tr>
      <tr><td>IQ-2026-012</td><td>Bikash Thapa</td><td>Bratabandha</td><td>9 Nov 2026</td><td>150–200</td><td>${P("Booked", "green")}</td></tr>
      <tr><td>IQ-2026-011</td><td>Asha Karki</td><td>Anniversary</td><td>21 Nov 2026</td><td>50–100</td><td>${P("Contacted")}</td></tr></tbody></table></div>`, "", 1),
    [{ t: "hl", to: "bell" }, { t: "hl", to: "row" }, { t: "click", to: "row" }]);

    () => shell("Settings", `<h2 class="pt">Settings</h2><div class="tabs"><span>Business</span><span>Quotations &amp; invoices</span><span class="on">Automations</span><span>Lists</span><span>System</span></div>
      <div class="g2" style="grid-template-columns:1.5fr 1fr"><div class="card p0"><div class="list"><div class="li"><b style="font-size:14px;flex:1">Automations</b>${B("Run daily checks now", "run", "sm")}</div>
      <div class="li"><span class="ok"></span><div class="t"><b>New website inquiry</b><small>Notify the team and email the visitor a confirmation</small></div><span class="tog"></span></div>

  /* 8. Website */
  add(7, "The website CMS",

      <div class="tabs"><span class="on">Homepage</span><span>Pages &amp; forms</span><span>SEO</span><span>Social links</span></div>
      <div class="card p0"><div class="list">
      ${[["Hero", "2 days ago"], ["Services", "1 week ago"], ["Featured gallery", "3 days ago"], ["Packages", "2 weeks ago"], ["Testimonials", "1 week ago"], ["How it works", "1 month ago"]].map(([n, w], i) =>

  add(7, "Edit a section",

    [{ t: "click", to: "up" }, { t: "wait", ms: 500 }, { t: "show", to: "newtile" }, { t: "toast", text: "Uploaded" }, { t: "click", to: "tedit" }, { t: "show", to: "dlg" },
     { t: "type", to: "alt", text: "Pastel mandap with white roses and fairy lights at Hotel Shanker" }, { t: "click", to: "msave" }, { t: "hide", to: "dlg" }, { t: "toast", text: "Saved" }]);

      <div class="tiles" style="grid-template-columns:repeat(4,1fr)">${["ph4", "ph3", "ph6", "ph5"].map((c, i) => `<div class="tile ${c}" style="height:150px"><div class="cap"><b>${["Garden wedding", "Mehendi night", "Bratabandha", "Anniversary dinner"][i]}</b><span class="sp"></span>${P("Published", "green")}</div></div>`).join("")}</div>`,

    [{ t: "click", to: "na" }, { t: "show", to: "dlg" }, { t: "type", to: "gt", text: "Pastel wedding at Hotel Shanker" }, { t: "type", to: "gl", text: "Kathmandu" }, { t: "type", to: "gd", text: "12 Dec 2026" },
     { t: "type", to: "gstory", text: "Soft pinks, white roses and a fairy-light canopy for Priya and Anil." }, { t: "sel", to: "gs", text: "Published" }, { t: "check", to: "gf" }, { t: "click", to: "gsave" }, { t: "hide", to: "dlg" }, { t: "toast", text: "Album created — open it and click Upload photos" }]);
  add(7, "Testimonials",
    "To add a testimonial, type the client's name, the event and their words. It only appears on the website when the status is Published and you tick that the client agreed to have it published.",
    () => shell("Testimonials", `<h2 class="pt">Testimonials</h2>`,
      `<div class="ov" data-t="dlg"><div class="dlg" style="width:640px"><h3>New testimonial</h3><div class="g2">${F("Client name", "", "tn")}${F("Event", "", "te")}</div>${F("Their words", "", "tw", "ta")}
      <div class="g2">${F("Rating", "No rating", "tr", "sel")}${F("Status", "Draft", "ts", "sel")}</div>${CB("The client agreed to have this published", "tc", false, "Required before it can appear on the website.")}<div class="foot">${B("Cancel", "tx")}${B("Save", "tsave", "p")}</div></div></div>`),
    [{ t: "type", to: "tn", text: "Priya & Anil" }, { t: "type", to: "te", text: "Wedding reception" }, { t: "type", to: "tw", text: "Everything was more beautiful than we imagined. Our guests are still talking about the mandap." },
     { t: "sel", to: "tr", text: "★★★★★" }, { t: "sel", to: "ts", text: "Published" }, { t: "check", to: "tc" }, { t: "hl", to: "tc" }, { t: "click", to: "tsave" }, { t: "toast", text: "Testimonial saved" }]);
  add(7, "That's the whole flow",
    "That's the whole flow: inquiry, quotation, booking, payment, email and the website. The written manual has every detail and a troubleshooting table. Thank you for watching.",
    () => `<div class="slide"><div><div class="kick">Recap</div><h1>From inquiry to <em>a paid event</em></h1>
      <p>Create the quotation from the inquiry · send the private link · record the advance · follow Money owed · keep the website fresh.</p>
      <div class="steps"><span>Settings › System for email health</span><span>Settings › Automations for reminders</span><span>Website for every page</span></div></div></div>`);

  /* ───────── player ───────── */
  const $ = s => document.querySelector(s);
  const stage = $("#stage"), screenEl = $("#screen"), cap = $("#cap"), where = $("#where"), fill = $("#fill"), time = $("#time");
  const playBtn = $("#play"), bigplay = $("#bigplay"), voiceBtn = $("#voiceBtn"), voiceSel = $("#voiceSel"), rateSel = $("#rateSel");
  const N = S.length;
  let idx = 0, playing = false, token = 0, voiceOn = true, rate = 1, voices = [], voice = null;
  let scale = 1, pos = { x: 640, y: 420 }, sceneStart = 0, sceneEst = 1;
  const synth = "speechSynthesis" in window ? window.speechSynthesis : null;
  if (!synth) { voiceOn = false; voiceBtn.disabled = true; voiceBtn.textContent = "No voice"; voiceSel.hidden = true; }

  new ResizeObserver(() => { scale = screenEl.clientWidth / 1280; stage.style.transform = `scale(${scale})`; }).observe(screenEl);

  const T = k => stage.querySelector(`[data-t="${k}"]`);
  const sleep = (ms, tk) => new Promise((res, rej) => setTimeout(() => (tk === token ? res() : rej("stop")), ms));
  const est = text => (text.split(/\s+/).length / (2.55 * rate)) * 1000 + 800;

  function center(el) {
    const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
    return { x: (r.left - s.left + r.width / 2) / scale, y: (r.top - s.top + r.height / 2) / scale };
  }
  function cursorTo(p) { const c = $("#cur"); if (c) c.style.transform = `translate(${p.x - 4}px, ${p.y - 3}px)`; pos = p; }
  function ripple() { const d = document.createElement("div"); d.className = "rip"; d.style.left = pos.x + "px"; d.style.top = pos.y + "px"; stage.appendChild(d); setTimeout(() => d.remove(), 600); }
  function toast(text) { stage.querySelectorAll(".toast").forEach(t => t.remove()); const d = document.createElement("div"); d.className = "toast"; d.innerHTML = "<i></i>"; d.appendChild(document.createTextNode(text)); stage.appendChild(d); }

  async function step(s, tk) {
    const el = s.to ? T(s.to) : null;
    if (s.to && !el) return;
    const move = async () => { cursorTo(center(el)); await sleep(760, tk); };
    switch (s.t) {
      case "move": await move(); break;
      case "click": await move(); ripple(); el.classList.add("press"); await sleep(200, tk); el.classList.remove("press"); await sleep(260, tk); break;
      case "check": await move(); ripple(); el.classList.toggle("on"); await sleep(420, tk); break;
      case "type": {
        if (!s.noclick) { await move(); ripple(); await sleep(180, tk); }
        el.textContent = ""; el.classList.add("typing");
        const d = Math.min(55, 1500 / s.text.length);
        for (const ch of s.text) { el.textContent += ch; await sleep(d, tk); }
        el.classList.remove("typing"); await sleep(260, tk); break;
      }
      case "sel": await move(); ripple(); el.classList.add("open"); await sleep(480, tk); el.textContent = s.text; el.classList.remove("open"); await sleep(300, tk); break;
      case "show": el.hidden = false; el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); await sleep(s.ms || 480, tk); break;
      case "hide": el.hidden = true; await sleep(220, tk); break;
      case "hl": el.classList.add("ring"); await sleep(s.ms || 1400, tk); el.classList.remove("ring"); await sleep(160, tk); break;
      case "html": el.innerHTML = s.html; await sleep(320, tk); break;
      case "toast": toast(s.text); await sleep(1700, tk); break;
      case "wait": await sleep(s.ms, tk); break;
    }
  }

  function speak(text, tk) {
    if (!voiceOn || !synth) return sleep(est(text), tk);
    synth.cancel();
    const parts = text.match(/[^.!?]+[.!?]+/g) || [text];
    return new Promise((res, rej) => {
      let done = false;
      const finish = () => { if (done) return; done = true; tk === token ? res() : rej("stop"); };
      parts.forEach((p, i) => {
        const u = new SpeechSynthesisUtterance(p.trim());
        u.rate = rate; if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = "en-GB";
        if (i === parts.length - 1) { u.onend = finish; u.onerror = finish; }
        synth.speak(u);
      });
      setTimeout(finish, est(text) * 1.9 + 5000);
    });
  }

  function render(i) {
    const sc = S[i];
    stage.innerHTML = sc.html() + `<svg class="cur" id="cur" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 2l15 9-6.6 1.4 3.6 7.1-2.7 1.4-3.6-7.2L4 18z" fill="#fff" stroke="#1a1416" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
    const c = $("#cur"); c.style.transition = "none"; cursorTo(pos); void c.offsetWidth; c.style.transition = "";
    where.textContent = `Chapter ${sc.ch + 1} · ${CHAPTERS[sc.ch]} — ${sc.title}`;
    cap.textContent = sc.say;
    time.textContent = `Step ${i + 1} of ${N}`;
    document.querySelectorAll(".chap").forEach((b, k) => { b.classList.toggle("on", k === sc.ch); if (k === sc.ch) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current"); });
  }

  async function playScene(i) {
    token++; const tk = token; idx = i; render(i); syncUI();
    if (!playing) return;
    sceneStart = performance.now(); sceneEst = est(S[i].say);
    try {
      await Promise.all([speak(S[i].say, tk), (async () => { await sleep(450, tk); for (const s of S[i].steps) await step(s, tk); })()]);
      await sleep(900, tk);
    } catch (e) { return; }
    if (tk !== token) return;
    if (i < N - 1) playScene(i + 1); else { playing = false; syncUI(); }
  }

  function syncUI() {
    playBtn.textContent = playing ? "Pause" : (idx === N - 1 && !playing && sceneStart ? "Replay" : "Play");
    bigplay.hidden = playing;
  }
  function play() { if (idx === N - 1 && sceneStart && !playing) idx = 0; playing = true; playScene(idx); }
  function pause() { playing = false; token++; if (synth) synth.cancel(); syncUI(); }
  function go(i) { i = Math.max(0, Math.min(N - 1, i)); if (synth) synth.cancel(); if (playing) playScene(i); else { token++; idx = i; render(i); syncUI(); } }

  playBtn.addEventListener("click", () => (playing ? pause() : play()));
  bigplay.addEventListener("click", play);
  $("#prev").addEventListener("click", () => go(idx - 1));
  $("#next").addEventListener("click", () => go(idx + 1));
  $("#bar").addEventListener("click", e => { const r = e.currentTarget.getBoundingClientRect(); go(Math.floor(((e.clientX - r.left) / r.width) * N)); });
  voiceBtn.addEventListener("click", () => { voiceOn = !voiceOn; voiceBtn.textContent = voiceOn ? "Voice on" : "Voice off"; voiceBtn.setAttribute("aria-pressed", String(voiceOn)); if (playing) playScene(idx); else if (synth) synth.cancel(); });
  rateSel.addEventListener("change", () => { rate = Number(rateSel.value); if (playing) playScene(idx); });
  voiceSel.addEventListener("change", () => { voice = voices[Number(voiceSel.value)] || null; try { localStorage.setItem("tt-voice", voice ? voice.name : ""); } catch (e) {} if (playing) playScene(idx); });
  $("#fs").addEventListener("click", async () => {
    try { if (document.fullscreenElement) await document.exitFullscreen(); else await $("#player").requestFullscreen(); } catch (e) { $("#fs").textContent = "Full screen not available"; }
  });
  document.addEventListener("fullscreenchange", () => { $("#fs").textContent = document.fullscreenElement ? "Exit full screen" : "Full screen"; });
  document.addEventListener("keydown", e => {
    const tag = (e.target.tagName || "").toLowerCase();
    if (["input", "select", "textarea", "button"].includes(tag)) return;
    if (e.code === "Space") { e.preventDefault(); playing ? pause() : play(); }
    else if (e.key === "ArrowRight") go(idx + 1);
    else if (e.key === "ArrowLeft") go(idx - 1);
  });

  function loadVoices() {
    if (!synth) return;
    const all = synth.getVoices().filter(v => /^en/i.test(v.lang));
    if (!all.length) return;
    const score = v => (/natural|online/i.test(v.name) ? 4 : 0) + (/aria|jenny|sonia|libby|google uk english female|samantha|zira/i.test(v.name) ? 2 : 0) + (/en-(GB|IN)/i.test(v.lang) ? 1 : 0);
    voices = all.sort((a, b) => score(b) - score(a));
    let saved = ""; try { saved = localStorage.getItem("tt-voice") || ""; } catch (e) {}
    voiceSel.innerHTML = voices.map((v, i) => `<option value="${i}">${v.name.replace(/^Microsoft |\s*\(.*$/g, "").slice(0, 28)}</option>`).join("");
    const k = Math.max(0, voices.findIndex(v => v.name === saved));
    voiceSel.value = String(k); voice = voices[k];
  }
  if (synth) { loadVoices(); synth.addEventListener ? synth.addEventListener("voiceschanged", loadVoices) : (synth.onvoiceschanged = loadVoices); }

  const counts = CHAPTERS.map((_, c) => S.filter(s => s.ch === c).length);
  $("#chapters").innerHTML = CHAPTERS.map((c, i) => `<button class="chap" data-c="${i}"><b>${String(i + 1).padStart(2, "0")}</b><span>${c}<small>${counts[i]} step${counts[i] === 1 ? "" : "s"}</small></span></button>`).join("");
  document.querySelectorAll(".chap").forEach(b => b.addEventListener("click", () => go(S.findIndex(s => s.ch === Number(b.dataset.c)))));

  (function tick() {
    const within = playing ? Math.min(0.97, (performance.now() - sceneStart) / sceneEst) : 0;
    fill.style.width = ((idx + within) / N) * 100 + "%";
    requestAnimationFrame(tick);
  })();

  render(0); syncUI();
})();
</script>
